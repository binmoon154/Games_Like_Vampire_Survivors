<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>뱀서라이크 생존 액션</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overflow: hidden;
      background: #10131c;
      color: white;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }
    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(10, 12, 20, .84);
      z-index: 5;
    }
    .panel {
      width: min(92vw, 720px);
      padding: 28px;
      border: 2px solid #58617b;
      border-radius: 18px;
      background: #1c2232;
      text-align: center;
      box-shadow: 0 12px 50px #0008;
    }
    h1 { color: #ffd166; margin-top: 0; }
    button {
      min-width: 150px;
      min-height: 48px;
      margin: 8px;
      border: 0;
      border-radius: 10px;
      background: #4cc9f0;
      color: #071018;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .cards {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      flex: 1 1 160px;
      min-height: 130px;
      padding: 16px;
      border: 2px solid #66708d;
      border-radius: 12px;
      background: #293149;
      color: white;
      cursor: pointer;
    }
    .card:hover { border-color: #ffd166; }
    .card.level-up-1 { border: 3px solid #35d07f; }
    .card.level-up-2 { border: 3px solid #3d9bff; }
    .card.level-up-3 { border: 3px solid #b56cff; }
    .card.level-up-1:hover { border-color: #35d07f; box-shadow: 0 0 14px #35d07f88; }
    .card.level-up-2:hover { border-color: #3d9bff; box-shadow: 0 0 14px #3d9bff88; }
    .card.level-up-3:hover { border-color: #b56cff; box-shadow: 0 0 14px #b56cff88; }
    .menu-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .corridor-screen { display: block; padding: 0; background: #0b0d15; overflow: hidden; }
    .corridor-header { position: fixed; top: 18px; left: 24px; z-index: 2; text-shadow: 2px 2px #000; }
    .corridor-header h1 { margin: 0; }
    .corridor-viewport { width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden; }
    .corridor { position: relative; display: flex; align-items: stretch; gap: 72px; width: 1940px; min-width: 1940px; height: 100%; padding: 118px 36px 72px; background: #151925; }
    .corridor::before { content: ""; position: absolute; inset: 118px 0 72px; background: repeating-linear-gradient(90deg, transparent 0 118px, #242a3a 119px 121px), linear-gradient(#252b3b 0 8px, transparent 8px calc(100% - 8px), #080a10 calc(100% - 8px)); opacity: .85; pointer-events: none; }
    .corridor-floor { position: absolute; left: 0; right: 0; bottom: 72px; height: 23%; background: repeating-linear-gradient(90deg, #1c2231 0 116px, #293146 118px 120px); border-top: 3px solid #3e4962; border-bottom: 4px solid #080a10; pointer-events: none; }
    .corridor-item, .corridor-door, .corridor-return { position: relative; z-index: 1; flex: 0 0 210px; align-self: flex-end; height: 420px; }
    .corridor-item { display: flex; align-items: center; justify-content: center; height: 420px; border: 2px solid #3a4358; background: linear-gradient(90deg, #111522, #20283a 50%, #10131e); color: #7d879c; }
    .elevator { width: 150px; height: 300px; border: 5px solid #505a70; background: repeating-linear-gradient(90deg, #171c29 0 14px, #252d40 15px 18px); box-shadow: inset 0 0 25px #000; text-align: center; }
    .elevator span { display: block; margin-top: 18px; font-size: 13px; color: #aab3c5; }
    .elevator small { display: block; margin-top: 210px; color: #667087; }
    .corridor-door { padding: 0; border: 8px solid #536079; border-bottom: 14px solid #39445b; background: #171d2c; color: white; text-align: center; box-shadow: inset 0 0 0 4px #121622, 0 14px 0 #0b0d14; cursor: pointer; }
    .corridor-door:hover { border-color: #ffd166; transform: translateY(-4px); }
    .corridor-door strong { display: block; margin-top: 150px; font-size: 24px; color: #ffd166; }
    .corridor-door small { display: block; margin: 12px 10px; color: #b9c3d9; }
    .corridor-return { display: flex; align-items: center; justify-content: center; height: 180px; margin-bottom: 115px; }
    .corridor-return button { background: #ef476f; color: white; }
    .corridor-info { position: fixed; left: 50%; bottom: 20px; z-index: 3; width: min(88vw, 620px); transform: translateX(-50%); padding: 12px 18px; border: 1px solid #66708d; border-radius: 10px; background: #111625ee; text-align: center; pointer-events: none; }
    .corridor-info h2 { margin: 0 0 4px; color: #4cc9f0; }
    .corridor-info p { margin: 4px 0; color: #dce2f2; }
    .room-screen { display: block; padding: 0; background: #555a5d; overflow: auto; }
    .room-panel { width: min(94vw, 760px); min-height: 100vh; margin: 0 auto; padding: 28px 18px 86px; text-align: center; }
    .room-panel h1 { margin: 0 0 20px; color: #fff; text-shadow: 2px 2px #303336; }
    .room-grid { display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr)); gap: 8px; }
    .room-card { min-height: 150px; padding: 8px 6px; border: 2px solid #9d7537; border-radius: 2px; background: #858585; color: #fff; box-shadow: inset 0 0 0 1px #c5c5c5; }
    .room-card-icon { display: grid; place-items: center; width: 52px; height: 52px; margin: 2px auto 7px; border: 2px solid #3a3d40; background: #202b31; color: #ffd166; font-size: 27px; }
    .room-card h3 { margin: 0 0 5px; font-size: 14px; color: #fff; text-shadow: 1px 1px #333; }
    .room-card p { min-height: 34px; margin: 0; color: #f1f1f1; font-size: 10px; line-height: 1.3; }
    .room-bars { display: flex; justify-content: center; gap: 2px; margin-top: 8px; }
    .room-bars i { display: block; width: 8px; height: 7px; border: 1px solid #282828; background: #4b2e1e; }
    .room-bars i.active { background: #e4a642; }
    #backToCorridor { background: #303a51; color: #fff; }
    @media (max-width: 800px) {
      .corridor { gap: 36px; width: 1500px; min-width: 1500px; padding-left: 24px; }
      .corridor-item, .corridor-door { flex-basis: 180px; }
      .corridor-door strong { font-size: 20px; }
      .corridor-info { bottom: 8px; }
    }
    #hud {
      position: fixed;
      inset: 0 0 auto;
      z-index: 2;
      padding: 12px;
      pointer-events: none;
      text-shadow: 1px 2px #000;
    }
    .bar {
      height: 16px;
      max-width: 420px;
      margin: 4px 0;
      overflow: hidden;
      border: 2px solid #111;
      border-radius: 8px;
      background: #33394b;
    }
    .fill { height: 100%; transition: width .1s; }
    #hpFill { background: #ef476f; }
    #xpFill { background: #06d6a0; }
    .loadout { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-width: 260px; }
    .loadout-group { display: flex; flex-wrap: wrap; gap: 4px; }
    .loadout-label { width: 52px; color: #ffd166; font-size: 12px; }
    .loadout-slot { padding: 2px 7px; border: 1px solid #66708d; border-radius: 4px; background: #293149; color: #fff; font-size: 12px; }
    .stat-list { text-align: left; line-height: 1.7; color: #dce2f2; }
    #pause {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      min-width: 48px;
      width: 48px;
      height: 44px;
      padding: 0;
      pointer-events: auto;
    }
    #joystick {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 3;
      width: 120px;
      height: 120px;
      border: 2px solid #ffffff55;
      border-radius: 50%;
      background: #ffffff18;
      pointer-events: auto;
    }
    #stick {
      position: absolute;
      left: 35px;
      top: 35px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #ffffff66;
    }
    .hidden { display: none !important; }
    @media (min-width: 800px) {
      #joystick { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div>생존 시간: <b id="time">00:00</b>　레벨: <b id="level">1</b>　처치: <b id="kills">0</b></div>
    <div class="bar"><div id="hpFill" class="fill"></div></div>
    <div class="bar"><div id="xpFill" class="fill"></div></div>
    <div class="loadout">
      <div class="loadout-group"><span class="loadout-label">무기</span><span id="weaponSlots"></span></div>
      <div class="loadout-group"><span class="loadout-label">패시브</span><span id="passiveSlots"></span></div>
    </div>
  </div>

  <button id="pause" class="hidden">Ⅱ</button>

  <div id="joystick" class="hidden"><div id="stick"></div></div>

  <section id="menu" class="screen">
    <div class="panel">
      <h1>뱀서라이크 생존 액션</h1>
      <p>WASD 또는 방향키로 이동하세요.<br>공격은 자동으로 발동됩니다.</p>
      <div class="menu-actions">
        <button id="start">게임 시작</button>
        <button id="codexButton">메뉴로 가기</button>
      </div>
    </div>
  </section>

  <section id="codex" class="screen corridor-screen hidden">
    <div class="corridor-header">
      <h1>관리동</h1>
      <span>왼쪽에서 시작해 필요한 방을 확인하세요.</span>
    </div>
    <div class="corridor-viewport" id="corridorViewport">
      <div class="corridor">
        <div class="corridor-floor"></div>
        <div class="corridor-item" title="상호작용할 수 없습니다.">
          <div class="elevator"><span>엘리베이터</span><small>운행하지 않음</small></div>
        </div>
        <button class="corridor-door" data-room="character">
          <strong>캐릭터</strong><small>플레이할 캐릭터 정보</small>
        </button>
        <button class="corridor-door" data-room="weapon">
          <strong>무기</strong><small>자동 공격 무기 도감</small>
        </button>
        <button class="corridor-door" data-room="passive">
          <strong>패시브</strong><small>성장 능력 도감</small>
        </button>
        <button class="corridor-door" data-room="map">
          <strong>맵 선택</strong><small>전투 지역 선택</small>
        </button>
        <div class="corridor-return">
          <button id="closeCodex">돌아가기</button>
        </div>
      </div>
    </div>
    <div id="codexContent" class="corridor-info">
      <h2>복도 입구</h2>
      <p>왼쪽에는 작동하지 않는 엘리베이터만 있습니다. 문을 선택해 내용을 확인하세요.</p>
    </div>
  </section>

  <section id="roomScreen" class="screen room-screen hidden">
    <div class="room-panel">
      <h1 id="roomTitle">무기</h1>
      <div id="roomGrid" class="room-grid"></div>
      <button id="backToCorridor">복도로 돌아가기</button>
    </div>
  </section>

  <section id="levelup" class="screen hidden">
    <div class="panel">
      <h1>레벨 업!</h1>
      <div id="choices" class="cards"></div>
    </div>
  </section>

  <section id="pauseScreen" class="screen hidden">
    <div class="panel">
      <h1>일시정지</h1>
      <div id="pauseStats" class="stat-list"></div>
      <button id="resume">계속하기</button>
      <button id="restart">다시 시작</button>
    </div>
  </section>

  <section id="result" class="screen hidden">
    <div class="panel">
      <h1 id="resultTitle">게임 오버</h1>
      <p id="resultText"></p>
      <button id="again">다시 하기</button>
    </div>
  </section>

<script>
const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");
const image = new Image();
image.src = "1.png";

let W = 0, H = 0, dpr = 1;
let atlas = null;
let last = 0;
let state = "menu";
let spawnTimer = 0;
let attackTimer = 0;
let bossTimers = new Set();
const map = { width: 1600, height: 1000 };
const camera = { x: 0, y: 0 };

const keys = new Set();
const enemies = [];
const projectiles = [];
const gems = [];
const effects = [];

const player = {
  x: 0, y: 0, radius: 18,
  hp: 100, maxHp: 100,
  speed: 210, damage: 10,
  attackSpeed: 0.9, pickup: 70,
  weapons: [], passives: [],
  level: 1, xp: 0, nextXp: 12,
  invincible: 0
};

const stats = {
  time: 0, kills: 0, bossKills: 0, score: 0
};

const spriteRects = {
  zombie: [86, 48, 136, 132],
  boar: [301, 64, 104, 114],
  skeleton: [496, 48, 96, 128],
  orc: [697, 48, 116, 128],
  minotaur: [188, 298, 132, 116],
  necromancer: [423, 287, 108, 118],
  imugi: [598, 276, 112, 138]
};

const enemyTypes = {
  zombie: { hp: 28, speed: 68, radius: 19, xp: 2, damage: 8 },
  boar: { hp: 45, speed: 104, radius: 20, xp: 3, damage: 12, minTime: 180 },
  skeleton: { hp: 55, speed: 52, radius: 17, xp: 4, damage: 10, minTime: 240 },
  orc: { hp: 100, speed: 44, radius: 25, xp: 8, damage: 18, minTime: 420 },
  minotaur: { hp: 800, speed: 42, radius: 38, xp: 40, damage: 25, boss: true },
  necromancer: { hp: 1800, speed: 28, radius: 42, xp: 80, damage: 30, boss: true },
  imugi: { hp: 3500, speed: 24, radius: 48, xp: 150, damage: 40, boss: true }
};

const characterCatalog = [
  {
    name: "생존자",
    description: "균형 잡힌 기본 캐릭터. 모든 무기를 안정적으로 사용할 수 있다.",
    stats: "체력 100 · 이동 속도 210 · 행운 0%"
  }
];

const weaponCatalog = [
  {
    id: "magicBullet",
    name: "마법 탄환",
    description: "시야에 들어온 가장 가까운 적을 자동 조준해 탄환을 발사한다.",
    stats: "피해 10 · 공격 주기 0.9초 · 사거리 400px"
  },
  {
    id: "spinningShuriken",
    name: "회전 수리검",
    description: "플레이어 주변을 회전하며 가까이 접근한 적을 공격한다.",
    stats: "피해 6 · 반경 70px · 회전 속도 180도/초"
  },
  {
    id: "lightning",
    name: "번개",
    description: "시야에 들어온 적 하나를 번개로 즉시 공격한다.",
    stats: "피해 18 · 공격 주기 2초 · 화면 안의 적 대상"
  }
];

const passiveCatalog = [
  { id: "power", name: "공격력 강화", description: "레벨마다 공격력 +12.5%." },
  { id: "speed", name: "신속", description: "Lv.1 기준 이동 속도 +7.5%. 레벨이 높을수록 증가폭 감소." },
  { id: "cooldown", name: "집중", description: "Lv.1 기준 공격 주기 -7.5%. 레벨이 높을수록 감소폭 감소." },
  { id: "vitality", name: "활력", description: "레벨마다 최대 체력 +10." },
  { id: "magnet", name: "자석", description: "Lv.1 기준 경험치 획득 범위 +20px. 레벨이 높을수록 증가폭 감소." }
];

const mapCatalog = [
  { name: "폐허 지대", description: "기본 맵. 넓은 공간에서 적 무리를 상대한다.", stats: "난이도 보통 · 보스 5분/10분/15분" },
  { name: "얼어붙은 통로", description: "차가운 바닥이 이어진 다음 지역. 이후 업데이트 예정.", stats: "잠김 · 추가 맵 준비 중" }
];

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!player.x) {
    player.x = W / 2;
    player.y = H / 2;
  }
}
addEventListener("resize", resize);
resize();

image.onload = () => {
  atlas = document.createElement("canvas");
  atlas.width = image.naturalWidth;
  atlas.height = image.naturalHeight;
  const a = atlas.getContext("2d");
  a.drawImage(image, 0, 0);
  const pixels = a.getImageData(0, 0, atlas.width, atlas.height);
  for (let i = 0; i < pixels.data.length; i += 4) {
    if (pixels.data[i] > 242 && pixels.data[i + 1] > 242 && pixels.data[i + 2] > 242) {
      pixels.data[i + 3] = 0;
    }
  }
  a.putImageData(pixels, 0, 0);
};

function resetGame() {
  enemies.length = 0;
  projectiles.length = 0;
  gems.length = 0;
  effects.length = 0;
  bossTimers.clear();

  Object.assign(player, {
    x: W / 2, y: H / 2, hp: 100, maxHp: 100,
    speed: 210, damage: 10, attackSpeed: .9,
    pickup: 70, weapons: [{ id: "magicBullet", level: 1 }], passives: [],
    level: 1, xp: 0, nextXp: 12, invincible: 0
  });
  camera.x = player.x;
  camera.y = player.y;
  Object.assign(stats, { time: 0, kills: 0, bossKills: 0, score: 0 });
  spawnTimer = 0;
  attackTimer = 0;

  for (let i = 0; i < 8; i++) spawnEnemy();
}

function findWeapon(id) {
  return player.weapons.find(weapon => weapon.id === id);
}

function findPassive(id) {
  return player.passives.find(passive => passive.id === id);
}

function diminishingEffect(originalEffect, level) {
  if (level <= 0) return 0;
  const firstLevelEffect = originalEffect * .5;
  const growthRatio = 5 / 7;
  return firstLevelEffect * (1 - Math.pow(growthRatio, level)) / (1 - growthRatio);
}

function linearNerfedEffect(originalEffect, level) {
  return originalEffect * .5 * level;
}

function recalculatePassives() {
  const hpRatio = player.maxHp > 0 ? player.hp / player.maxHp : 1;
  const powerBonus = linearNerfedEffect(.25, findPassive("power")?.level || 0);
  const speedBonus = diminishingEffect(.15, findPassive("speed")?.level || 0);
  const cooldownBonus = diminishingEffect(.15, findPassive("cooldown")?.level || 0);
  const vitalityBonus = linearNerfedEffect(20, findPassive("vitality")?.level || 0);
  const pickupBonus = diminishingEffect(40, findPassive("magnet")?.level || 0);

  player.damage = 10 * (1 + powerBonus);
  player.speed = 210 * (1 + speedBonus);
  player.attackSpeed = .9 * (1 - cooldownBonus);
  player.maxHp = 100 + vitalityBonus;
  player.pickup = 70 + pickupBonus;
  player.hp = Math.min(player.maxHp, player.maxHp * hpRatio);
}

function addWeapon(id, levels = 1) {
  const weapon = findWeapon(id);
  if (weapon) {
    weapon.level += levels;
  } else if (player.weapons.length < 2) {
    player.weapons.push({ id, level: levels });
  }
}

function addPassive(id, levels = 1) {
  const passive = findPassive(id);
  if (passive) {
    passive.level += levels;
  } else if (player.passives.length < 3) {
    player.passives.push({ id, level: levels });
  }
  recalculatePassives();
}

function getUpgradeAmount() {
  const roll = Math.random();
  if (roll < 0.08) return 3;
  if (roll < 0.28) return 2;
  return 1;
}

function showRoom(room) {
  const catalogs = {
    character: {
      title: "캐릭터실",
      items: characterCatalog.map(item => ({ name: item.name, description: item.description, icon: "♟", rank: 3 }))
    },
    weapon: {
      title: "무기실",
      items: weaponCatalog.map((item, index) => ({ name: item.name, description: item.description, icon: ["✦", "◈", "ϟ"][index], rank: index + 2 }))
    },
    passive: {
      title: "패시브실",
      items: passiveCatalog.map((item, index) => ({ name: item.name, description: item.description, icon: ["⚔", "➤", "◉", "♥", "✥"][index], rank: 2 }))
    },
    map: {
      title: "맵 선택실",
      items: mapCatalog.map((item, index) => ({ name: item.name, description: item.description, icon: index === 0 ? "▦" : "?", rank: index === 0 ? 4 : 1 }))
    }
  };
  const selected = catalogs[room];
  if (!selected) return;
  roomTitle.textContent = selected.title;
  roomGrid.innerHTML = selected.items.map(item => {
    const bars = Array.from({ length: 5 }, (_, index) =>
      `<i class="${index < item.rank ? "active" : ""}"></i>`
    ).join("");
    return `<article class="room-card">
      <div class="room-card-icon">${item.icon}</div>
      <h3>${item.name}</h3>
      <p>${item.description}</p>
      <div class="room-bars" aria-label="등급 ${item.rank}/5">${bars}</div>
    </article>`;
  }).join("");
  codex.classList.add("hidden");
  roomScreen.classList.remove("hidden");
}

function openCodex() {
  corridorViewport.scrollLeft = 0;
  codexContent.innerHTML = "<h2>복도 입구</h2><p>왼쪽에는 작동하지 않는 엘리베이터만 있습니다. 문을 선택해 내용을 확인하세요.</p>";
  roomScreen.classList.add("hidden");
  menu.classList.add("hidden");
  codex.classList.remove("hidden");
}

function closeCodexView() {
  roomScreen.classList.add("hidden");
  codex.classList.add("hidden");
  menu.classList.remove("hidden");
}

function closeRoomView() {
  roomScreen.classList.add("hidden");
  codex.classList.remove("hidden");
}

function startGame() {
  resetGame();
  state = "playing";
  menu.classList.add("hidden");
  codex.classList.add("hidden");
  roomScreen.classList.add("hidden");
  result.classList.add("hidden");
  pauseScreen.classList.add("hidden");
  hud.classList.remove("hidden");
  pause.classList.remove("hidden");
  joystick.classList.remove("hidden");
}

function togglePause() {
  if (state === "playing") {
    state = "paused";
    updatePauseStats();
    pauseScreen.classList.remove("hidden");
  } else if (state === "paused") {
    state = "playing";
    pauseScreen.classList.add("hidden");
  }
}

function spawnEnemy(type = randomEnemyType()) {
  if (enemies.length >= 250) return;

  const angle = Math.random() * Math.PI * 2;
  const distance = Math.max(W, H) * .65 + 100;
  const data = enemyTypes[type];

  enemies.push({
    type,
    x: player.x + Math.cos(angle) * distance,
    y: player.y + Math.sin(angle) * distance,
    hp: data.hp * Math.pow(1.08, Math.floor(stats.time / 60)),
    maxHp: data.hp * Math.pow(1.08, Math.floor(stats.time / 60)),
    radius: data.radius,
    speed: data.speed * (1 + Math.min(.4, Math.floor(stats.time / 120) * .05)),
    hitTimer: 0,
    boss: data.boss || false
  });
}

function randomEnemyType() {
  const t = stats.time;
  const choices = ["zombie"];
  if (t >= 180) choices.push("boar");
  if (t >= 240) choices.push("skeleton");
  if (t >= 420) choices.push("orc");
  return choices[Math.floor(Math.random() * choices.length)];
}

function spawnBoss(type) {
  if (bossTimers.has(type)) return;
  bossTimers.add(type);
  spawnEnemy(type);
  effects.push({ x: player.x, y: player.y - 80, text: `${type} 등장!`, life: 3, max: 3 });
}

function screenPosition(entity) {
  return {
    x: entity.x - camera.x + W / 2,
    y: entity.y - camera.y + H / 2
  };
}

function isVisible(entity, margin = 0) {
  const position = screenPosition(entity);
  return position.x >= -margin && position.x <= W + margin &&
    position.y >= -margin && position.y <= H + margin;
}

function nearestEnemy() {
  let best = null;
  let distance = Infinity;
  for (const e of enemies) {
    if (e.hp <= 0 || !isVisible(e, e.radius)) continue;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < distance) {
      distance = d;
      best = e;
    }
  }
  return best;
}

function shoot() {
  const target = nearestEnemy();
  if (!target) return;

  for (const weapon of player.weapons) {
    const dx = target.x - player.x;
    const dy = target.y - player.y;
    const length = Math.hypot(dx, dy) || 1;
    const weaponDamage = weapon.id === "lightning" ? 18 :
      weapon.id === "spinningShuriken" ? 6 : player.damage;

    if (weapon.id === "lightning") {
      target.hp -= weaponDamage * weapon.level;
      effects.push({ x: target.x, y: target.y, text: "번개!", life: .5, max: .5 });
      continue;
    }

    projectiles.push({
      x: player.x, y: player.y,
      vx: dx / length * (weapon.id === "spinningShuriken" ? 380 : 500),
      vy: dy / length * (weapon.id === "spinningShuriken" ? 380 : 500),
      radius: weapon.id === "spinningShuriken" ? 9 : 7,
      damage: weaponDamage * weapon.level,
      life: .9, pierce: weapon.id === "spinningShuriken" ? 2 : 1
    });
  }
}

function gainXp(value) {
  player.xp += value;
  stats.score += value * 10;

  while (player.xp >= player.nextXp) {
    player.xp -= player.nextXp;
    player.level++;
    player.nextXp = Math.floor((20 + player.level * 15 + Math.pow(player.level, 1.4) * 2) / 3);
    showLevelUp();
  }
}

function showLevelUp() {
  if (state === "levelup") return;
  state = "levelup";
  levelup.classList.remove("hidden");

  const weaponChoices = weaponCatalog
    .filter(weapon => findWeapon(weapon.id) || player.weapons.length < 2)
    .map(weapon => ({
      type: "weapon",
      id: weapon.id,
      name: weapon.name,
      description: weapon.description,
      level: findWeapon(weapon.id)?.level || 0,
      apply: amount => addWeapon(weapon.id, amount)
    }));
  const passiveChoices = passiveCatalog
    .filter(passive => findPassive(passive.id) || player.passives.length < 3)
    .map(passive => ({
      type: "passive",
      id: passive.id,
      name: passive.name,
      description: passive.description,
      level: findPassive(passive.id)?.level || 0,
      apply: amount => addPassive(passive.id, amount)
    }));
  const selected = [...weaponChoices, ...passiveChoices]
    .sort(() => Math.random() - .5)
    .slice(0, 3);
  choices.innerHTML = "";

  selected.forEach((choice, index) => {
    const card = document.createElement("button");
    const upgradeAmount = getUpgradeAmount();
    card.className = `card level-up-${upgradeAmount}`;
    const finalLevel = choice.level + upgradeAmount;
    card.innerHTML = `<b>${index + 1}. ${choice.name}</b><br><small>${choice.type === "weapon" ? "무기" : "패시브"} · Lv.${choice.level} → Lv.${finalLevel}<br>+${upgradeAmount} 레벨<br>${choice.description}</small>`;
    card.onclick = () => {
      choice.apply(upgradeAmount);
      levelup.classList.add("hidden");
      state = "playing";
      updateHud();
    };
    choices.appendChild(card);
  });
}

function update(dt) {
  stats.time += dt;
  player.invincible = Math.max(0, player.invincible - dt);

  const direction = getMovement();
  player.x += direction.x * player.speed * dt;
  player.y += direction.y * player.speed * dt;
  camera.x = player.x;
  camera.y = player.y;

  const interval =
    stats.time < 120 ? 1.5 :
    stats.time < 300 ? 1 :
    stats.time < 600 ? .7 : .45;

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = interval;
  }

  if (stats.time >= 300) spawnBoss("minotaur");
  if (stats.time >= 600) spawnBoss("necromancer");
  if (stats.time >= 900) spawnBoss("imugi");

  attackTimer -= dt;
  if (attackTimer <= 0) {
    shoot();
    attackTimer = player.attackSpeed;
  }

  for (const e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const distance = Math.hypot(dx, dy) || 1;
    e.x += dx / distance * e.speed * dt;
    e.y += dy / distance * e.speed * dt;

    if (distance < e.radius + player.radius && player.invincible <= 0) {
      player.hp -= enemyTypes[e.type].damage;
      player.invincible = .7;
      if (player.hp <= 0) endGame(false);
    }
  }

  for (const p of projectiles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    for (const e of enemies) {
      if (e.hp <= 0) continue;
      if (Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.radius) {
        e.hp -= p.damage;
        p.pierce--;
        effects.push({ x: e.x, y: e.y, text: Math.round(p.damage), life: .5, max: .5 });
        if (p.pierce < 0) p.life = 0;
        break;
      }
    }
  }

  for (const g of gems) {
    const dx = player.x - g.x;
    const dy = player.y - g.y;
    const distance = Math.hypot(dx, dy) || 1;

    if (distance < player.pickup) {
      g.x += dx / distance * 260 * dt;
      g.y += dy / distance * 260 * dt;
    }
    if (distance < 24) {
      g.collected = true;
      gainXp(g.value);
    }
  }

  for (const e of enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      stats.kills++;
      if (e.boss) {
        stats.bossKills++;
        if (e.type === "imugi") endGame(true);
      }
      gems.push({ x: e.x, y: e.y, value: enemyTypes[e.type].xp });
    }
  }

  for (const e of enemies) e.hitTimer -= dt;
  for (const p of projectiles) p.life -= 0;
  for (const f of effects) f.life -= dt;

  cleanup();
  updateHud();
}

function cleanup() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].dead) enemies.splice(i, 1);
  }
  for (let i = projectiles.length - 1; i >= 0; i--) {
    if (projectiles[i].life <= 0) projectiles.splice(i, 1);
  }
  for (let i = gems.length - 1; i >= 0; i--) {
    if (gems[i].collected) gems.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    if (effects[i].life <= 0) effects.splice(i, 1);
  }
}

function getMovement() {
  let x = 0, y = 0;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) x--;
  if (keys.has("KeyD") || keys.has("ArrowRight")) x++;
  if (keys.has("KeyW") || keys.has("ArrowUp")) y--;
  if (keys.has("KeyS") || keys.has("ArrowDown")) y++;

  x += joystickVector.x;
  y += joystickVector.y;

  const length = Math.hypot(x, y) || 1;
  return { x: x / Math.max(1, length), y: y / Math.max(1, length) };
}

function drawSprite(type, x, y, size) {
  if (!atlas) {
    ctx.fillStyle = "#8ac926";
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
    return;
  }
  const [sx, sy, sw, sh] = spriteRects[type];
  ctx.drawImage(atlas, sx, sy, sw, sh, x - size / 2, y - size / 2, size, size);
}

function drawMap() {
  const left = Math.floor((camera.x - W / 2) / map.width) - 1;
  const right = Math.ceil((camera.x + W / 2) / map.width) + 1;
  const top = Math.floor((camera.y - H / 2) / map.height) - 1;
  const bottom = Math.ceil((camera.y + H / 2) / map.height) + 1;

  for (let tileY = top; tileY <= bottom; tileY++) {
    for (let tileX = left; tileX <= right; tileX++) {
      const originX = tileX * map.width - camera.x + W / 2;
      const originY = tileY * map.height - camera.y + H / 2;
      ctx.fillStyle = (tileX + tileY) % 2 === 0 ? "#171b29" : "#1a2030";
      ctx.fillRect(originX, originY, map.width, map.height);

      ctx.strokeStyle = "#242b3e";
      ctx.lineWidth = 1;
      for (let x = 0; x <= map.width; x += 48) {
        ctx.beginPath();
        ctx.moveTo(originX + x, originY);
        ctx.lineTo(originX + x, originY + map.height);
        ctx.stroke();
      }
      for (let y = 0; y <= map.height; y += 48) {
        ctx.beginPath();
        ctx.moveTo(originX, originY + y);
        ctx.lineTo(originX + map.width, originY + y);
        ctx.stroke();
      }

      ctx.fillStyle = "#293149";
      ctx.fillRect(originX + 680, originY + 420, 240, 80);
      ctx.fillStyle = "#303a51";
      ctx.fillRect(originX + 740, originY + 180, 120, 70);
      ctx.strokeStyle = "#58617b";
      ctx.strokeRect(originX + 680, originY + 420, 240, 80);
      ctx.strokeRect(originX + 740, originY + 180, 120, 70);
    }
  }
}

function render() {
  drawMap();

  for (const g of gems) {
    if (!isVisible(g, 20)) continue;
    const position = screenPosition(g);
    ctx.fillStyle = "#06d6a0";
    ctx.beginPath();
    ctx.moveTo(position.x, position.y - 7);
    ctx.lineTo(position.x + 7, position.y);
    ctx.lineTo(position.x, position.y + 7);
    ctx.lineTo(position.x - 7, position.y);
    ctx.closePath();
    ctx.fill();
  }

  for (const p of projectiles) {
    if (!isVisible(p, 20)) continue;
    const position = screenPosition(p);
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(position.x, position.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const e of enemies) {
    if (!isVisible(e, e.radius + 30)) continue;
    const position = screenPosition(e);
    drawSprite(e.type, position.x, position.y, e.radius * 2.5);
    if (e.boss || e.hp < e.maxHp) {
      ctx.fillStyle = "#000";
      ctx.fillRect(position.x - 28, position.y - e.radius - 10, 56, 5);
      ctx.fillStyle = "#ef476f";
      ctx.fillRect(position.x - 28, position.y - e.radius - 10, 56 * Math.max(0, e.hp / e.maxHp), 5);
    }
  }

  ctx.fillStyle = player.invincible > 0 ? "#ffffff" : "#4cc9f0";
  ctx.beginPath();
  ctx.arc(W / 2, H / 2, player.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px sans-serif";
  for (const f of effects) {
    if (!isVisible(f, 40)) continue;
    const position = screenPosition(f);
    ctx.globalAlpha = f.life / f.max;
    ctx.fillText(f.text, position.x, position.y - (1 - f.life / f.max) * 25);
  }
  ctx.globalAlpha = 1;
}

function updateHud() {
  const minutes = Math.floor(stats.time / 60).toString().padStart(2, "0");
  const seconds = Math.floor(stats.time % 60).toString().padStart(2, "0");
  time.textContent = `${minutes}:${seconds}`;
  level.textContent = player.level;
  kills.textContent = stats.kills;
  hpFill.style.width = `${Math.max(0, player.hp / player.maxHp * 100)}%`;
  xpFill.style.width = `${player.xp / player.nextXp * 100}%`;
  weaponSlots.innerHTML = player.weapons.map(weapon => {
    const data = weaponCatalog.find(item => item.id === weapon.id);
    return `<span class="loadout-slot">${data.name} Lv.${weapon.level}</span>`;
  }).join("") || "<span class=\"loadout-slot\">없음</span>";
  passiveSlots.innerHTML = player.passives.map(passive => {
    const data = passiveCatalog.find(item => item.id === passive.id);
    return `<span class="loadout-slot">${data.name} Lv.${passive.level}</span>`;
  }).join("") || "<span class=\"loadout-slot\">없음</span>";
}

function updatePauseStats() {
  const weapons = player.weapons.map(weapon => {
    const data = weaponCatalog.find(item => item.id === weapon.id);
    return `${data.name} Lv.${weapon.level}`;
  }).join(", ") || "없음";
  const passives = player.passives.map(passive => {
    const data = passiveCatalog.find(item => item.id === passive.id);
    return `${data.name} Lv.${passive.level}`;
  }).join(", ") || "없음";
  pauseStats.innerHTML = `
    <b>현재 능력치</b><br>
    체력: ${Math.ceil(player.hp)} / ${player.maxHp}<br>
    이동 속도: ${Math.round(player.speed)}<br>
    공격력: ${Math.round(player.damage)}<br>
    공격 주기: ${player.attackSpeed.toFixed(2)}초<br>
    경험치 획득 범위: ${Math.round(player.pickup)}<br>
    <br><b>장착 무기 (${player.weapons.length}/2)</b><br>${weapons}<br>
    <b>장착 패시브 (${player.passives.length}/3)</b><br>${passives}
  `;
}

function endGame(won) {
  if (state === "gameover" || state === "victory") return;
  state = won ? "victory" : "gameover";
  hud.classList.add("hidden");
  pause.classList.add("hidden");
  joystick.classList.add("hidden");
  result.classList.remove("hidden");
  resultTitle.textContent = won ? "승리!" : "게임 오버";
  resultText.innerHTML =
    `생존 시간: ${Math.floor(stats.time)}초<br>` +
    `처치 수: ${stats.kills}<br>` +
    `보스 처치: ${stats.bossKills}<br>` +
    `레벨: ${player.level}<br>` +
    `점수: ${stats.score}`;
}

function loop(now) {
  const dt = Math.min((now - last) / 1000 || 0, .05);
  last = now;
  if (state === "playing") update(dt);
  render();
  requestAnimationFrame(loop);
}

const joystickVector = { x: 0, y: 0 };
let joystickId = null;

function moveJoystick(touch) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let x = touch.clientX - cx;
  let y = touch.clientY - cy;
  const distance = Math.hypot(x, y);
  const max = 45;
  if (distance > max) {
    x = x / distance * max;
    y = y / distance * max;
  }
  joystickVector.x = x / max;
  joystickVector.y = y / max;
  stick.style.transform = `translate(${x}px, ${y}px)`;
}

joystick.addEventListener("touchstart", e => {
  e.preventDefault();
  if (joystickId === null) {
    joystickId = e.changedTouches[0].identifier;
    moveJoystick(e.changedTouches[0]);
  }
}, { passive: false });

joystick.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickId) moveJoystick(touch);
  }
}, { passive: false });

joystick.addEventListener("touchend", e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickId) {
      joystickId = null;
      joystickVector.x = joystickVector.y = 0;
      stick.style.transform = "";
    }
  }
}, { passive: false });

addEventListener("keydown", e => {
  keys.add(e.code);
  if (e.code === "Escape") togglePause();
  if (state === "levelup" && ["Digit1", "Digit2", "Digit3"].includes(e.code)) {
    document.querySelectorAll(".card")[Number(e.code.at(-1)) - 1]?.click();
  }
});
addEventListener("keyup", e => keys.delete(e.code));

start.onclick = startGame;
codexButton.onclick = openCodex;
closeCodex.onclick = closeCodexView;
backToCorridor.onclick = closeRoomView;
document.querySelectorAll(".corridor-door").forEach(door => {
  door.onclick = () => showRoom(door.dataset.room);
});
again.onclick = startGame;
pause.onclick = togglePause;
resume.onclick = togglePause;
restart.onclick = startGame;

requestAnimationFrame(loop);
</script>
</body>
</html>
