<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>뱀서라이크 생존 액션</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div>생존 시간: <b id="time">00:00</b>　레벨: <b id="level">1</b>　처치: <b id="kills">0</b></div>
    <div id="bossTimerHud" class="hidden">보스 제한 시간: <b id="bossTimer">02:00</b></div>
    <div class="bar"><div id="hpFill" class="fill"></div></div>
    <div class="bar"><div id="xpFill" class="fill"></div></div>
    <div class="loadout">
      <div class="loadout-group"><span id="weaponLabel" class="loadout-label">무기 0 / 2</span><div id="weaponSlots" class="slot-grid"></div></div>
      <div class="loadout-group"><span id="passiveLabel" class="loadout-label">패시브 0 / 3</span><div id="passiveSlots" class="slot-grid"></div></div>
    </div>
  </div>

  <button id="pause" class="hidden">Ⅱ</button>

  <div id="joystick" class="hidden"><div id="stick"></div></div>

  <section id="menu" class="screen">
    <div class="panel">
      <h1>뱀서라이크 생존 액션</h1>
      <p>WASD 또는 방향키로 이동하세요.<br>공격은 자동으로 발동됩니다.</p>
      <div class="menu-actions">
        <button id="start">게임 시작</button>
        <button id="codexButton">메뉴로 가기</button>
      </div>
    </div>
  </section>

  <section id="codex" class="screen corridor-screen hidden">
    <div class="corridor-header">
      <h1>관리동</h1>
      <span>왼쪽에서 시작해 필요한 방을 확인하세요.</span>
    </div>
    <div class="corridor-viewport" id="corridorViewport">
      <div class="corridor">
        <div class="corridor-floor"></div>
        <div class="corridor-item" title="상호작용할 수 없습니다.">
          <div class="elevator"><span>엘리베이터</span><small>운행하지 않음</small></div>
        </div>
        <button class="corridor-door" data-room="character">
          <strong>캐릭터</strong><small>플레이할 캐릭터 정보</small>
        </button>
        <button class="corridor-door" data-room="weapon">
          <strong>무기</strong><small>자동 공격 무기 도감</small>
        </button>
        <button class="corridor-door" data-room="passive">
          <strong>패시브</strong><small>성장 능력 도감</small>
        </button>
        <button class="corridor-door" data-room="map">
          <strong>맵 선택</strong><small>전투 지역 선택</small>
        </button>
        <div class="corridor-return">
          <button id="closeCodex">돌아가기</button>
        </div>
      </div>
    </div>
    <div id="codexContent" class="corridor-info">
      <h2>복도 입구</h2>
      <p>왼쪽에는 작동하지 않는 엘리베이터만 있습니다. 문을 선택해 내용을 확인하세요.</p>
    </div>
  </section>

  <section id="roomScreen" class="screen room-screen hidden">
    <div class="room-panel">
      <h1 id="roomTitle">무기</h1>
      <div id="roomGrid" class="room-grid"></div>
      <button id="backToCorridor">복도로 돌아가기</button>
    </div>
  </section>

  <section id="levelup" class="screen hidden">
    <div class="panel levelup-panel">
      <aside id="upgradePreview" class="upgrade-preview"></aside>
      <div class="upgrade-options">
        <h1>레벨 업!</h1>
        <div id="choices" class="cards"></div>
      </div>
    </div>
  </section>

  <section id="pauseScreen" class="screen hidden">
    <div class="panel">
      <h1>일시정지</h1>
      <div id="pauseStats" class="stat-list"></div>
      <button id="resume">계속하기</button>
      <button id="restart">다시 시작</button>
      <button id="returnToMenu">메인화면으로</button>
    </div>
  </section>

  <section id="result" class="screen hidden">
    <div class="panel">
      <h1 id="resultTitle">게임 오버</h1>
      <p id="resultText"></p>
      <button id="nextMapButton" class="hidden">다음 맵 선택</button>
      <button id="again">다시 하기</button>
    </div>
  </section>

  <section id="mapSelectScreen" class="screen hidden">
    <div class="panel">
      <h1>다음 맵 선택</h1>
      <div id="mapChoices" class="cards"></div>
      <p id="mapSelectionStatus"></p>
      <button id="startSelectedMap" disabled>선택한 맵 시작</button>
      <button id="returnFromMapSelect">메인 메뉴로</button>
    </div>
  </section>

<script src="game.js"></script>
</body>
</html>
